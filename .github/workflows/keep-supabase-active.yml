name: Keep Supabase active

on:
  schedule:
    # Daily at 10:17 Malaysia time (UTC+8).
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out configuration
        uses: actions/checkout@v4

      - name: Run the safe keepalive query
        shell: bash
        run: |
          set -euo pipefail

          supabase_url="$(sed -n 's/^[[:space:]]*url:[[:space:]]*"\([^"]*\)".*/\1/p' supabase-config.js)"
          publishable_key="$(sed -n 's/^[[:space:]]*publishableKey:[[:space:]]*"\([^"]*\)".*/\1/p' supabase-config.js)"

          test -n "$supabase_url"
          test -n "$publishable_key"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST \
            --header "apikey: $publishable_key" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$supabase_url/rest/v1/rpc/github_keepalive")"

          # github_keepalive returns only {"ok": true}; it never reads or writes finance data.
          if [[ "$status" == "200" ]] && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$response_file"; then
            echo "Supabase keepalive query completed successfully (HTTP 200)."
            exit 0
          fi

          echo "Unexpected Supabase response: HTTP $status" >&2
          exit 1
